<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<!-- PWA Meta Tags -->
	<meta name="theme-color" content="#4f46e5" />
	<meta name="description" content="Sistema completo de gerenciamento de veículos com CRUD e rastreamento" />

	<!-- PWA Manifest -->
	<link rel="manifest" href="/manifest.json" />

	<!-- Apple Touch Icons -->
	<link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="Vehicle Manager" />

	<!-- Favicon -->
	<link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

	<script>
		// Aplicar tema imediatamente para evitar flash
		(function () {
			const stored = localStorage.getItem('theme');
			const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
			const theme = stored || (prefersDark ? 'dark' : 'light');
			if (theme === 'dark') {
				document.documentElement.classList.add('dark');
			}
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
